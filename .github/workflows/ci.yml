name: CI & Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Node ${{ matrix.node }} (C11 ASan/UBSan + Native + Pure-JS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Build Native C11 N-API Accelerator
        run: npm run build:native

      - name: Run C11 AddressSanitizer + UndefinedBehaviorSanitizer Suite
        run: npm run test:san

      - name: Run Conformance + Red-Team Differential Fuzzing (C11 Native)
        run: npm test

      - name: Run Conformance + Red-Team Suite (Pure-JS Fallback)
        run: npm run test:purejs

      - name: Run TLS 1.3 Scenarios & Multi-Agent Mesh Demo
        run: npm run scenario && npm run example
